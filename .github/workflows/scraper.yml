name: MMA Job Scraper & Alert Pipeline

on:
  # 1. 정기 자동 실행 (매일 한국 시간 오전 09:00 / UTC 00:00)
  schedule:
    - cron: '0 0 * * *'

  # 2. 외부(Cloudflare Worker, 웹 UI)에서 원격 수동 실행 가능하도록 허용
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # DB 파일 커밋 및 푸시 권한

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Scraping Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Commit and push updated database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mma_jobs.db
          if git diff --staged --quiet; then
            echo "[INFO] No database changes to commit."
          else
            git commit -m "chore: auto-update mma_jobs.db [skip ci]"
            git push
          fi